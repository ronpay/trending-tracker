[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "trending-tracker"
version = "0.1.0"
description = "Track emerging AI research topics on arXiv"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "trending-tracker contributors"}]
dependencies = []

[project.scripts]
trending-tracker = "trending_tracker.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
trending_tracker = ["web/*.css", "web/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
